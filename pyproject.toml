[project]
name = "cta-navdata"
version = "1.0.0"
description = "Builds the cold temperature altitude correction navigation database from FAA source data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["arinc424>=0.3.0", "defusedxml>=0.7", "httpx>=0.28", "pdfplumber>=0.11"]

[project.scripts]
cta-navdata = "cta_navdata.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]
