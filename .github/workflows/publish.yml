name: Publish Nav Data

on:
  schedule:
    # Daily. Publishes the next cycle on the day before it takes effect: the FAA posts CIFP
    # weeks early, but the d-TPP metafile only covers the current and next cycles, so this is
    # the earliest point at which every source for the incoming cycle is available. On any
    # other day it publishes the current cycle if that has no release yet, so a failed run is
    # retried daily until it succeeds.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle to build: current, next, or YYYY-MM-DD. Blank = as scheduled.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-nav-data
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish
    # Runs on the ubuntu-latest host rather than a container so the preinstalled gh CLI is available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Choose the cycle to publish
        id: cycle
        env:
          GH_TOKEN: ${{ github.token }}
          # The dispatch input reaches the shell as an environment variable, never
          # interpolated into the command line.
          DISPATCH_CYCLE: ${{ github.event.inputs.cycle }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_CYCLE" ]; then
            candidates=("$DISPATCH_CYCLE")
          else
            candidates=(next current)
          fi
          tomorrow="$(date -u -d tomorrow +%F)"

          # Stops at the first released cycle: once the next cycle is out, publishing the current
          # one would make a superseded cycle the latest release.
          for selector in "${candidates[@]}"; do
            tag="$(cta-navdata --print-cycle --cycle "$selector")"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists."
              break
            elif [ -z "$DISPATCH_CYCLE" ] && [ "$selector" = next ] && [[ "$tomorrow" < "$tag" ]]; then
              echo "Cycle $tag is more than a day out (tomorrow is $tomorrow)."
            else
              echo "Publishing cycle $selector, taking effect $tag."
              {
                echo "selector=$selector"
                echo "tag=$tag"
                echo "publish=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Nothing to publish."
          echo "publish=false" >> "$GITHUB_OUTPUT"

      - name: Fetch the previous manifest
        if: steps.cycle.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Absent on the very first run, and its absence simply skips the drift check.
        run: gh release download --pattern manifest.json --dir previous || true

      - name: Generate
        if: steps.cycle.outputs.publish == 'true'
        env:
          SELECTOR: ${{ steps.cycle.outputs.selector }}
        run: |
          set -euo pipefail
          cta-navdata --cycle "$SELECTOR" --output out --cache .cache \
            --previous-manifest previous/manifest.json 2>&1 | tee generation.log

      - name: Publish release
        if: steps.cycle.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cycle.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/cta-navdata.json.gz out/manifest.json \
            --title "Nav Data $TAG" \
            --notes "Cold temperature altitude correction data for the AIRAC cycle taking effect $TAG."

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp generation.log diagnostics/ 2>/dev/null || true
          cp .cache/Cold_Temp_Airports.pdf diagnostics/ 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # The cycle is unresolved when the run fails before the step that reckons it.
          name: diagnostics-${{ steps.cycle.outputs.tag || github.run_id }}
          path: diagnostics
          if-no-files-found: ignore

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads the repository from the checkout, which a failure this step reports
          # may have been what failed.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.cycle.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Both titles are fixed strings, so every failure of a kind lands on one issue.
          title="${TAG:+Nav data generation failed for cycle $TAG}"
          title="${title:-Nav data publish run failed before a cycle was resolved}"
          summary="${TAG:+Generation for the cycle taking effect **$TAG** failed}"
          summary="${summary:-The run failed before a target cycle was resolved}"

          # The log is written to a file rather than interpolated, so nothing in it can be
          # read as shell.
          {
            echo "$summary, so no release was published. Consumers stay on the previous"
            echo "cycle until this is fixed."
            echo
            echo "[View the run]($RUN_URL) — the diagnostics artifact, where the run got far"
            echo "enough to produce one, holds the log and the cold temperature PDF as"
            echo "downloaded."
            echo
            echo '```'
            tail -c 8000 generation.log 2>/dev/null || echo "No generation log was produced."
            echo '```'
          } > issue-body.md

          existing="$(TITLE="$title" gh issue list --state open --search "$title in:title" \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
            echo "Commented on existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi
