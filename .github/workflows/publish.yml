name: Publish Nav Data

on:
  schedule:
    # Daily, but a no-op except on the day before a cycle takes effect. The FAA posts CIFP
    # weeks early, but the d-TPP metafile only covers the current and next cycles, so this is
    # the earliest point at which every source for the incoming cycle is available.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle to build: current, next, or YYYY-MM-DD. Blank = next.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-nav-data
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish
    # Runs on the ubuntu-latest host rather than a container so the preinstalled gh CLI is available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install
        run: pip install -e .

      - name: Resolve target cycle
        id: cycle
        env:
          # The dispatch input reaches the shell as an environment variable, never
          # interpolated into the command line.
          DISPATCH_CYCLE: ${{ github.event.inputs.cycle }}
        run: |
          set -euo pipefail
          selector="${DISPATCH_CYCLE:-next}"
          tag="$(cta-navdata --print-cycle --cycle "$selector")"
          echo "selector=$selector" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Target cycle $selector takes effect $tag."

      - name: Decide whether to publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CYCLE: ${{ github.event.inputs.cycle }}
          TAG: ${{ steps.cycle.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tomorrow="$(date -u -d tomorrow +%F)"
          if [ -z "$DISPATCH_CYCLE" ] && [[ "$tomorrow" < "$TAG" ]]; then
            echo "Cycle $TAG is more than a day out (tomorrow is $tomorrow); skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Fetch the previous manifest
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Absent on the very first run, and its absence simply skips the drift check.
        run: gh release download --pattern manifest.json --dir previous || true

      - name: Generate
        if: steps.decide.outputs.publish == 'true'
        env:
          SELECTOR: ${{ steps.cycle.outputs.selector }}
        run: |
          set -euo pipefail
          cta-navdata --cycle "$SELECTOR" --output out --cache .cache \
            --previous-manifest previous/manifest.json 2>&1 | tee generation.log

      - name: Publish release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cycle.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/cta-navdata.json.gz out/manifest.json \
            --title "Nav Data $TAG" \
            --notes "Cold temperature altitude correction data for the AIRAC cycle taking effect $TAG."

      - name: Collect diagnostics
        if: failure() && steps.decide.outputs.publish == 'true'
        run: |
          mkdir -p diagnostics
          cp generation.log diagnostics/ 2>/dev/null || true
          cp .cache/Cold_Temp_Airports.pdf diagnostics/ 2>/dev/null || true

      - name: Upload diagnostics
        if: failure() && steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ steps.cycle.outputs.tag }}
          path: diagnostics
          if-no-files-found: ignore

      - name: Report failure
        if: failure() && steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cycle.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nav data generation failed for cycle $TAG"

          # The log is written to a file rather than interpolated, so nothing in it can be
          # read as shell.
          {
            echo "Generation for the cycle taking effect **$TAG** failed, so no release was"
            echo "published. Consumers stay on the previous cycle until this is fixed."
            echo
            echo "[View the run]($RUN_URL) — the diagnostics artifact holds the log and the"
            echo "cold temperature PDF as downloaded."
            echo
            echo '```'
            tail -c 8000 generation.log 2>/dev/null || echo "No generation log was produced."
            echo '```'
          } > issue-body.md

          existing="$(gh issue list --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
            echo "Commented on existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi
